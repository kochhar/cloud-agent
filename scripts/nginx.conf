# Local multi-instance entry point for the cloud-agent application.
#
# The launcher supplies the prefix (-p) used by the relative pid and log
# paths below. Control instances listen on 8101-8103 and the dashboard on
# 8200; only this proxy binds a public port.

worker_processes auto;
pid nginx.pid;
error_log logs/proxy-error.log info;

events {
    worker_connections 256;
}

http {
    map $upstream_addr $backend_instance {
        default          $upstream_addr;
        "127.0.0.1:8101" "control-1";
        "127.0.0.1:8102" "control-2";
        "127.0.0.1:8103" "control-3";
        "127.0.0.1:8200" "dashboard-1";
    }

    log_format proxy_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"instance":"$backend_instance",'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"request_seconds":$request_time,'
        '"upstream_seconds":"$upstream_response_time"}';

    access_log logs/proxy-access.jsonl proxy_json;

    upstream control_pool {
        least_conn;
        server 127.0.0.1:8101;
        server 127.0.0.1:8102;
        server 127.0.0.1:8103;
        keepalive 64;
    }

    upstream dashboard {
        server 127.0.0.1:8200;
        keepalive 8;
    }

    server {
        listen 0.0.0.0:80 default_server;
        server_name _;

        location = / {
            return 308 /ui/;
        }

        location = /ui {
            return 308 /ui/;
        }

        location /ui/ {
            proxy_pass http://control_pool/ui/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /ui;
            proxy_next_upstream off;
            add_header X-Upstream-Instance $backend_instance always;
        }

        location = /api {
            return 308 /api/;
        }

        location /api/ {
            # The public /api prefix is not part of the control-plane routes.
            proxy_pass http://control_pool/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api;

            # Event and sandbox polls are held for 25 seconds. Session
            # creation can also contain the complete model retry budget.
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 25m;
            proxy_send_timeout 25m;

            # POST /sessions and action results must never be replayed onto a
            # second instance after an ambiguous upstream failure.
            proxy_next_upstream off;
            add_header X-Upstream-Instance $backend_instance always;
        }

        location = /ops/dash {
            return 308 /ops/dash/;
        }

        location /ops/dash/api/ {
            proxy_pass http://dashboard/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /ops/dash;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream off;
            add_header X-Upstream-Instance $backend_instance always;
        }

        location /ops/dash/ {
            proxy_pass http://dashboard/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /ops/dash;
            proxy_next_upstream off;
            add_header X-Upstream-Instance $backend_instance always;
        }

        location / {
            return 404;
        }
    }
}
